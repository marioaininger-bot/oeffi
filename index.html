<!doctype html>
<html lang="de" data-mode="hell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>98A Hoechlegasse</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: eine schmale Spalte. Oben der Umschalter, dann die gewählte Ansicht (Hell, Tafel oder Modern), unten Status und Aktualisieren.
   Beide Ansichten werden aus denselben Daten gefüllt, html[data-mode] entscheidet, welche sichtbar ist. */
:root {
  --f-dot: 'Doto', 'DM Mono', ui-monospace, monospace;
  --f-num: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'DM Mono', ui-monospace, monospace;
  color-scheme: dark;

  /* Tafel */
  --t-bg: #0A0805; --t-amber: #FFB000; --t-dim: #B87A00; --t-mid: #D99500; --t-rule: #5A3D00; --t-rule2: #3A2800; --t-late: #FF6A3D;
  /* Modern */
  --m-bg: #08141D; --m-glow: #12384A; --m-text: #E6F4FA; --m-muted: #86A9BB; --m-faint: #5F8296; --m-track: rgba(134,169,187,.25);
  --m-accent: #22D3EE; --m-onaccent: #04141C; --m-ok: #34D399; --m-warn: #FBBF24; --m-red: #E2001A; --m-bad: #F87171;
}
* { box-sizing: border-box; }
html { background: var(--t-bg); }
html[data-mode="modern"] { background: var(--m-bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background-color: var(--t-bg); color: var(--t-amber);
  background-repeat: no-repeat;
  font-family: var(--f-dot); font-weight: 900; font-size: 17px; line-height: 1.35;
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(22px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
html[data-mode="modern"] body {
  background-color: var(--m-bg);
  background-image: radial-gradient(520px 420px at 50% 14%, var(--m-glow), transparent 72%);
  color: var(--m-text); font-family: var(--f-body); font-weight: 500;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.tn { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

/* Kopfzeile mit Umschalter */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; }
.top-l { font-size: 15px; letter-spacing: .08em; color: var(--t-dim); }
.seg { display: inline-flex; }
.seg button { font: inherit; background: transparent; border: 0; min-height: 40px; padding: 0 14px; }
html[data-mode="tafel"] .seg { border: 2px solid var(--t-rule); }
html[data-mode="tafel"] .seg button { font: 900 13px var(--f-dot); letter-spacing: .08em; color: var(--t-dim); text-transform: uppercase; }
html[data-mode="tafel"] .seg button[aria-pressed="true"] { background: var(--t-amber); color: var(--t-bg); }
html[data-mode="modern"] .seg { background: rgba(255,255,255,.08); border: 1px solid var(--m-track); border-radius: 999px; padding: 3px; gap: 2px; }
html[data-mode="modern"] .seg button { font: 600 13px var(--f-body); color: var(--m-muted); border-radius: 999px; min-height: 34px; }
html[data-mode="modern"] .seg button[aria-pressed="true"] { background: var(--m-accent); color: var(--m-onaccent); }
html[data-mode="modern"] .top-l { font: 500 11px var(--f-mono); letter-spacing: .08em; color: var(--m-ok); display: flex; align-items: center; gap: 6px; }
html[data-mode="modern"] .top-l::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
html[data-mode="modern"] .top-l[data-s="old"] { color: var(--m-warn); }

/* ===== Ansicht Tafel ===== */
.hd-t { display: flex; gap: 12px; align-items: baseline; border-bottom: 2px dotted var(--t-rule); padding-bottom: 10px; }
.hd-t b { font-size: 42px; line-height: 1; }
.hd-t span { font-size: 15px; color: var(--t-mid); line-height: 1.15; text-transform: uppercase; }
.t-list { display: flex; flex-direction: column; }
.t-line { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: baseline; font-size: 26px; padding: 8px 0; border-bottom: 1px dotted var(--t-rule2); }
.t-line .n { font-size: 20px; color: var(--t-dim); }
.t-line .d { font-size: 16px; color: var(--t-dim); }
.t-line.first { font-size: clamp(38px, 12vw, 52px); padding: 14px 0 16px; border-bottom: 2px dotted var(--t-rule); }
.t-line.first .n { font-size: 26px; }
.t-line.first .d { font-size: 22px; color: var(--t-amber); }
.t-line .late { color: var(--t-late); }
.t-empty { color: var(--t-dim); font-size: 20px; padding: 14px 0; }

/* ===== Ansicht Modern ===== */
.hd-m { display: flex; align-items: center; gap: 12px; }
.badge { background: var(--m-red); color: #fff; font: 700 28px/1 var(--f-num); padding: 8px 12px; border-radius: 6px; letter-spacing: .03em; }
.hd-m b { display: block; font-weight: 700; font-size: 19px; line-height: 1.15; }
.hd-m span { font-size: 14px; color: var(--m-muted); }
.ringbox { position: relative; width: min(160px, 46vw); aspect-ratio: 1; margin: 6px auto 0; }
.ringbox svg { width: 100%; height: 100%; display: block; }
.ringbox circle.fill { transition: stroke-dashoffset .6s ease; }
.mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.mid b { font: 700 clamp(48px, 16vw, 68px)/1 var(--f-num); }
.mid b.now { font-size: clamp(34px, 11vw, 46px); }
.mid span { font: 500 12px var(--f-mono); color: var(--m-muted); letter-spacing: .14em; }
.at { text-align: center; font-size: 16px; color: #B9D3E0; }
.at em { font-style: normal; font-weight: 700; color: var(--m-ok); }
.at em.warn { color: var(--m-warn); }
.m-empty { text-align: center; color: var(--m-muted); padding: 8px 0; }
.axis { position: relative; height: 84px; margin: 0 14px; }
.axis .ln { position: absolute; left: 0; right: 0; top: 16px; height: 4px; border-radius: 2px; background: var(--m-track); }
.tick { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--m-muted); white-space: nowrap; }
.tick i { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--m-accent); border: 3px solid var(--m-bg); margin-top: 8px; }
.tick.l i { background: var(--m-warn); }
.tick.l span { color: var(--m-warn); }
.tick.f i { width: 20px; height: 20px; margin-top: 5px; box-shadow: 0 0 0 4px rgba(34,211,238,.22); }
.tick b { font: 700 21px/1 var(--f-num); color: var(--m-text); margin-top: 4px; }
.tick.nosub span { visibility: hidden; }
.scale { display: flex; justify-content: space-between; font: 500 10px var(--f-mono); color: var(--m-faint); margin: -12px 14px 0; letter-spacing: .08em; }

/* ===== Gemeinsam: Fehler, Statuszeile ===== */
.err { border: 1px solid var(--t-late); padding: 12px 14px; }
html[data-mode="modern"] .err { border-color: var(--m-bad); border-radius: 12px; }
.err p { margin: 0 0 6px; }
.err p:last-child { margin: 0; font-size: 15px; opacity: .8; }
a { color: inherit; }

.bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; font-size: 14px; letter-spacing: .06em; color: var(--t-dim); margin-top: 6px; }
.bar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--t-dim); margin-right: 8px; }
.bar[data-s="ok"] .dot { background: var(--t-amber); }
.bar[data-s="bad"] .dot { background: var(--t-late); }
.bar button { min-height: 44px; padding: 0 16px; border: 2px solid var(--t-amber); border-radius: 0; background: transparent; color: var(--t-amber); font: 900 14px var(--f-dot); letter-spacing: .1em; text-transform: uppercase; }
.bar button[disabled] { opacity: .6; cursor: default; }
html[data-mode="modern"] .bar { color: var(--m-muted); font: 400 13px var(--f-body); letter-spacing: 0; }
html[data-mode="modern"] .bar .dot { background: var(--m-muted); }
html[data-mode="modern"] .bar[data-s="ok"] .dot { background: var(--m-ok); }
html[data-mode="modern"] .bar[data-s="bad"] .dot { background: var(--m-bad); }
html[data-mode="modern"] .bar button { border: 1px solid var(--m-accent); border-radius: 999px; color: var(--m-accent); font: 600 14px var(--f-body); letter-spacing: .02em; text-transform: none; }

/* ===== Ansicht Hell ===== */
html[data-mode="hell"] { background: #F4F1EC; color-scheme: light; }
html[data-mode="hell"] body { background-color: #F4F1EC; color: #16181B; font-family: 'Barlow', system-ui, sans-serif; font-weight: 500; }
html[data-mode="hell"] .top-l { font: 600 15px 'Barlow', system-ui, sans-serif; letter-spacing: .02em; color: #5B5F66; }
html[data-mode="hell"] .seg { border: 1px solid #D9D4CB; border-radius: 8px; padding: 3px; gap: 2px; background: #fff; }
html[data-mode="hell"] .seg button { font: 600 13px 'Barlow', system-ui, sans-serif; letter-spacing: .04em; color: #5B5F66; border-radius: 6px; min-height: 34px; }
html[data-mode="hell"] .seg button[aria-pressed="true"] { background: #E2001A; color: #fff; }
.h-wrap { border: 1px solid #D9D4CB; border-radius: 10px; overflow: hidden; background: #FBF9F5; }
.h-band { background: #E2001A; color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.h-bus { background: #fff; color: #E2001A; font: 700 30px/1 var(--f-num); padding: 6px 10px; border-radius: 4px; letter-spacing: .03em; }
.h-band b { display: block; font-size: 19px; font-weight: 700; line-height: 1.1; }
.h-band span.s { font-size: 13px; opacity: .9; }
.h-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.h-first { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: end; padding-bottom: 12px; border-bottom: 3px solid #16181B; }
.h-first .num { font: 700 clamp(64px, 22vw, 92px)/.82 var(--f-num); }
.h-first .num.now { font-size: clamp(40px, 13vw, 56px); line-height: .9; }
.h-first .u { font: 600 24px/1 var(--f-num); letter-spacing: .06em; text-transform: uppercase; padding-bottom: 6px; }
.h-first .u small { display: block; font: 500 15px 'Barlow', system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: #5B5F66; margin-top: 4px; }
.h-ok { color: #0E7A4F; font-weight: 700; }
.h-warn { color: #B26A00; font-weight: 700; }
.h-empty { color: #5B5F66; padding: 6px 0; }
.h-rows { display: flex; flex-direction: column; }
.h-r { display: grid; grid-template-columns: 70px 1fr auto; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid #D9D4CB; }
.h-r:last-child { border-bottom: 0; }
.h-r b { font: 700 34px/1 var(--f-num); }
.h-r b small { font: 600 12px var(--f-num); letter-spacing: .08em; color: #5B5F66; margin-left: 3px; }
.h-r .t { font-size: 16px; }
.h-r .st { font-size: 13px; font-weight: 700; color: #0E7A4F; }
.h-r.l .st { color: #B26A00; }
.h-axis { position: relative; height: 24px; margin: 4px 8px 0; }
.h-axis .ln { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: #D4CEC3; border-radius: 2px; }
.h-axis i { position: absolute; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #E2001A; border: 3px solid #FBF9F5; transform: translateX(-50%); }
.h-axis i.l { background: #E8A100; }
.h-axis i.f { width: 18px; height: 18px; top: 2px; }
.h-scale { display: flex; justify-content: space-between; font: 500 10.5px 'Barlow', system-ui, sans-serif; color: #8A8A8A; margin: 0 8px; letter-spacing: .05em; }
html[data-mode="hell"] .err { background: #fff; border: 1px solid #B42318; border-radius: 8px; }
html[data-mode="hell"] .bar { color: #5B5F66; font: 500 13px 'Barlow', system-ui, sans-serif; letter-spacing: 0; }
html[data-mode="hell"] .bar .dot { background: #5B5F66; }
html[data-mode="hell"] .bar[data-s="ok"] .dot { background: #0E7A4F; }
html[data-mode="hell"] .bar[data-s="bad"] .dot { background: #B42318; }
html[data-mode="hell"] .bar button { border: 0; border-radius: 6px; background: #16181B; color: #fff; font: 600 14px 'Barlow', system-ui, sans-serif; letter-spacing: .04em; text-transform: none; }

#t-box, #m-box { display: flex; flex-direction: column; gap: 22px; }
#h-box { display: flex; flex-direction: column; gap: 16px; }
.m-conn { display: flex; flex-direction: column; gap: 12px; }
.m-conn + .m-conn { border-top: 1px solid var(--m-track); padding-top: 20px; }
.m-conn .at { margin-top: -2px; }

@media (prefers-reduced-motion: reduce) { .ringbox circle.fill { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="top-l tn" id="top-l"></span>
    <div class="seg" role="group" aria-label="Ansicht">
      <button type="button" data-mode="tafel" aria-pressed="false">Tafel</button>
      <button type="button" data-mode="modern" aria-pressed="false">Modern</button>
      <button type="button" data-mode="hell" aria-pressed="true">Hell</button>
    </div>
  </div>

  <!-- Ansichten: je Verbindung wird ein Block aus den Daten gebaut -->
  <section id="v-tafel" aria-label="Abfahrten, Tafel-Ansicht" hidden><div id="t-box"></div></section>
  <section id="v-modern" aria-label="Abfahrten, moderne Ansicht" hidden><div id="m-box"></div></section>
  <section id="v-hell" aria-label="Abfahrten, helle Ansicht"><div id="h-box"></div></section>

  <div class="err" id="err" role="alert" hidden>
    <p id="err-t"></p>
    <p>Die Rohdaten kannst du hier prüfen: <a href="https://www.wienerlinien.at/ogd_realtime/monitor?rbl=8680&amp;rbl=1049&amp;rbl=4251" target="_blank" rel="noopener noreferrer">Wiener Linien, Haltestellen 8680, 1049 und 4251</a></p>
  </div>

  <div class="bar" id="bar" data-s="">
    <span role="status" aria-live="polite"><i class="dot"></i><span id="stamp">Noch nicht geladen</span></span>
    <button type="button" id="reload">Aktualisieren</button>
  </div>
</main>

<script>
(function () {
  'use strict';
  /* Adresse deines Cloudflare Workers, zum Beispiel https://oeffi.dein-name.workers.dev */
  var URL_API = 'https://oeffi.mario-aininger.workers.dev';
  /* Verbindungen in der Reihenfolge der Anzeige. rbl = Steig-Nummer der Wiener Linien, muss zur Liste im Worker passen. */
  var CONNS = [
    { id: '98A', rbl: '8680', line: '98A', name: 'Hoechlegasse', to: 'Aspernstraße U' },
    { id: '26A', rbl: '1049', line: '26A', name: 'Lohwaggasse', to: 'Kagran U' },
    { id: 'U2',  rbl: '4251', line: 'U2',  name: 'Aspernstraße', to: 'Karlsplatz', color: '#9A4C97', tafel: '#D79BD4' }
  ];
  var TZ = 'Europe/Vienna', EVERY = 30000, KEY = 'oeffi-ansicht';
  var RING_FULL = 540.4, RING_MIN = 10, AXIS_MIN = 30, SHOW = 4;
  var SVGNS = 'http://www.w3.org/2000/svg';
  var tf = new Intl.DateTimeFormat('de-AT', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
  var tfs = new Intl.DateTimeFormat('de-AT', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: TZ });
  var state = { deps: {}, at: 0, err: null };
  var busy = false, timer = 0, mode = 'hell';

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  /* "+0100" ohne Doppelpunkt versteht nicht jeder Browser, Safari zum Beispiel nicht */
  function parseTime(s) { return Date.parse(String(s || '').replace(/([+-]\d{2})(\d{2})$/, '$1:$2')); }
  function setText(id, v) { $(id).textContent = v; }

  /* Ergebnis: je Verbindung eine sortierte Liste. null heißt, die Haltestelle fehlt in der Antwort. */
  function collect(json) {
    var monitors = (json && json.data && json.data.monitors) || [], out = {};
    CONNS.forEach(function (c) {
      var found = false, list = [];
      monitors.forEach(function (m) {
        var attr = (m.locationStop && m.locationStop.properties && m.locationStop.properties.attributes) || {};
        if (String(attr.rbl) !== c.rbl) return;
        found = true;
        (m.lines || []).forEach(function (l) {
          if (l.name !== c.line) return;
          ((l.departures && l.departures.departure) || []).forEach(function (d) {
            var t = d.departureTime || {}, p = parseTime(t.timePlanned), r = parseTime(t.timeReal || t.timePlanned);
            if (isFinite(r)) list.push({ p: isFinite(p) ? p : r, r: r });
          });
        });
      });
      list.sort(function (a, b) { return a.r - b.r; });
      out[c.id] = found ? list : null;
    });
    return out;
  }

  async function load() {
    if (busy) return;
    if (URL_API.indexOf('https://') !== 0) { state.err = 'Die Adresse des Workers ist noch nicht in der Seite eingetragen.'; render(); return; }
    busy = true; $('reload').disabled = true;
    var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 10000);
    try {
      var r = await fetch(URL_API, { cache: 'no-store', signal: ctl.signal });
      if (!r.ok) throw { kind: 'http', status: r.status };
      state = { deps: collect(await r.json()), at: Date.now(), err: null };
    } catch (e) {
      state.err = e && e.kind === 'http' ? 'Die Wiener Linien antworten mit Fehler ' + e.status + '.'
        : (e && e.name === 'AbortError' ? 'Die Wiener Linien antworten nicht rechtzeitig.'
        : 'Der Abruf ist fehlgeschlagen. Du bist offline oder der Worker ist nicht erreichbar.');
    } finally {
      clearTimeout(to); busy = false; $('reload').disabled = false;
    }
    render();
  }

  function delayMin(d) { return Math.round((d.r - d.p) / 60000); }
  function isLate(d) { return delayMin(d) >= 2; }
  function countdown(d, now) { return Math.max(0, Math.floor((d.r - now) / 60000)); }
  function upcoming(c, now) {
    var all = state.deps[c.id];
    return all ? all.filter(function (d) { return d.r > now - 30000; }) : null;
  }
  /* Text, wenn es nichts anzuzeigen gibt */
  function emptyText(up) {
    if (!state.at) return state.err ? 'Keine Daten geladen.' : 'Lädt …';
    if (up === null) return 'Für diese Haltestelle kamen keine Daten.';
    return 'Keine Abfahrten in den nächsten Minuten gemeldet.';
  }

  /* ---- Ansicht Tafel ---- */
  function blockTafel(c, up, now) {
    var wrap = el('div', 't-conn');
    var hd = el('div', 'hd-t'); var tb = el('b', '', c.id); if (c.tafel) tb.style.color = c.tafel; hd.appendChild(tb);
    var sp = el('span'); sp.appendChild(document.createTextNode(c.name.toUpperCase())); sp.appendChild(el('br')); sp.appendChild(document.createTextNode('> ' + c.to.toUpperCase()));
    hd.appendChild(sp); wrap.appendChild(hd);
    var box = el('div', 't-list tn'); wrap.appendChild(box);
    if (!up || !up.length) { box.appendChild(el('div', 't-empty', emptyText(up).toUpperCase())); return wrap; }
    up.slice(0, SHOW).forEach(function (d, i) {
      var m = countdown(d, now), late = isLate(d);
      var row = el('div', 't-line' + (i === 0 ? ' first' : ''));
      row.appendChild(el('span', 'n', '>'));
      row.appendChild(el('span', '', m < 1 ? 'JETZT' : m + ' MIN'));
      row.appendChild(el('span', 'd' + (late ? ' late' : ''), (late ? '+' + delayMin(d) + ' · ' : '') + tf.format(new Date(d.r))));
      box.appendChild(row);
    });
    return wrap;
  }

  /* ---- Ansicht Modern ---- */
  function ring(fillOffset) {
    var svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('viewBox', '0 0 200 200'); svg.setAttribute('aria-hidden', 'true');
    function circ(stroke, extra) {
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', '100'); c.setAttribute('cy', '100'); c.setAttribute('r', '86'); c.setAttribute('fill', 'none');
      c.setAttribute('stroke', stroke); c.setAttribute('stroke-width', '10');
      if (extra) { c.setAttribute('stroke-linecap', 'round'); c.setAttribute('stroke-dasharray', String(RING_FULL)); c.setAttribute('stroke-dashoffset', String(fillOffset)); c.setAttribute('transform', 'rotate(-90 100 100)'); }
      return c;
    }
    svg.appendChild(circ('rgba(134,169,187,.22)')); svg.appendChild(circ('#22D3EE', true));
    return svg;
  }
  function blockModern(c, up, now) {
    var wrap = el('div', 'm-conn');
    var hd = el('div', 'hd-m'); var bd = el('span', 'badge', c.id); if (c.color) bd.style.background = c.color; hd.appendChild(bd);
    var who = el('div'); who.appendChild(el('b', '', c.name)); who.appendChild(el('span', '', 'Richtung ' + c.to));
    hd.appendChild(who); wrap.appendChild(hd);
    var rb = el('div', 'ringbox'), mid = el('div', 'mid'), num = el('b', 'tn'), unit = el('span');
    mid.appendChild(num); mid.appendChild(unit);
    var at = el('div', 'at tn');
    if (!up || !up.length) {
      num.textContent = '–';
      rb.appendChild(ring(RING_FULL)); rb.appendChild(mid); wrap.appendChild(rb);
      at.appendChild(el('span', 'm-empty', emptyText(up))); wrap.appendChild(at);
      return wrap;
    }
    var d = up[0], m = countdown(d, now), late = isLate(d);
    num.textContent = m < 1 ? 'jetzt' : String(m);
    if (m < 1) num.className = 'tn now';
    unit.textContent = m < 1 ? '' : (m === 1 ? 'MINUTE' : 'MINUTEN');
    rb.appendChild(ring(RING_FULL * (Math.min(m, RING_MIN) / RING_MIN))); rb.appendChild(mid); wrap.appendChild(rb);
    at.appendChild(document.createTextNode('Abfahrt ' + tf.format(new Date(d.r)) + ' · '));
    at.appendChild(el('em', late ? 'warn' : '', late ? '+' + delayMin(d) + ' Min (geplant ' + tf.format(new Date(d.p)) + ')' : 'pünktlich'));
    wrap.appendChild(at);

    var tl = el('div'), axis = el('div', 'axis tn'); axis.appendChild(el('div', 'ln'));
    var lastPct = -100, any = false;
    up.slice(0, SHOW + 1).forEach(function (x, i) {
      var mm = countdown(x, now);
      if (mm > AXIS_MIN) return;
      any = true;
      var pct = Math.max(4, Math.min(96, mm / AXIS_MIN * 100));
      var t = el('div', 'tick' + (i === 0 ? ' f' : '') + (isLate(x) ? ' l' : '') + (pct - lastPct < 11 ? ' nosub' : ''));
      t.style.left = pct + '%';
      t.appendChild(el('i'));
      t.appendChild(el('b', '', String(mm)));
      t.appendChild(el('span', '', isLate(x) ? '+' + delayMin(x) + ' Min' : tf.format(new Date(x.r))));
      axis.appendChild(t);
      lastPct = pct;
    });
    if (any) {
      tl.appendChild(axis);
      var sc = el('div', 'scale'); sc.appendChild(el('span', '', 'JETZT')); sc.appendChild(el('span', '', '30 MIN'));
      tl.appendChild(sc); wrap.appendChild(tl);
    }
    return wrap;
  }

  /* ---- Ansicht Hell ---- */
  function blockHell(c, up, now) {
    var wrap = el('div', 'h-wrap');
    var band = el('div', 'h-band'); if (c.color) band.style.background = c.color;
    var bus = el('span', 'h-bus', c.id); if (c.color) bus.style.color = c.color; band.appendChild(bus);
    var who = el('div'); who.appendChild(el('b', '', c.name)); who.appendChild(el('span', 's', 'Richtung ' + c.to));
    band.appendChild(who); wrap.appendChild(band);
    var body = el('div', 'h-body'); wrap.appendChild(body);
    var first = el('div', 'h-first tn'); body.appendChild(first);
    if (!up || !up.length) { first.appendChild(el('div', 'h-empty', emptyText(up))); return wrap; }
    var d = up[0], m = countdown(d, now), late = isLate(d);
    first.appendChild(el('div', 'num' + (m < 1 ? ' now' : ''), m < 1 ? 'jetzt' : String(m)));
    var u = el('div', 'u', m < 1 ? '' : (m === 1 ? 'Minute' : 'Minuten'));
    var sm = el('small', '', tf.format(new Date(d.r)) + ' Uhr · ');
    sm.appendChild(el('span', late ? 'h-warn' : 'h-ok', late ? '+' + delayMin(d) + ' Min' : 'pünktlich'));
    u.appendChild(sm); first.appendChild(u);
    var rows = el('div', 'h-rows tn'); body.appendChild(rows);
    up.slice(1, SHOW).forEach(function (x) {
      var mm = countdown(x, now), lt = isLate(x);
      var r = el('div', 'h-r' + (lt ? ' l' : ''));
      var b = el('b', '', mm < 1 ? 'jetzt' : String(mm));
      if (mm >= 1) b.appendChild(el('small', '', 'MIN'));
      r.appendChild(b);
      r.appendChild(el('span', 't', tf.format(new Date(x.r)) + ' Uhr'));
      r.appendChild(el('span', 'st', lt ? '+' + delayMin(x) + ' Min' : 'pünktlich'));
      rows.appendChild(r);
    });
    var axis = el('div', 'h-axis'); axis.setAttribute('aria-hidden', 'true'); axis.appendChild(el('div', 'ln'));
    var any = false;
    up.slice(0, SHOW + 1).forEach(function (x, i) {
      var mm = countdown(x, now);
      if (mm > AXIS_MIN) return;
      any = true;
      var dot = el('i', (i === 0 ? 'f' : '') + (isLate(x) ? ' l' : ''));
      if (c.color && !isLate(x)) dot.style.background = c.color;
      dot.style.left = Math.max(4, Math.min(96, mm / AXIS_MIN * 100)) + '%';
      axis.appendChild(dot);
    });
    if (any) {
      var tl = el('div'); tl.appendChild(axis);
      var sc = el('div', 'h-scale'); sc.appendChild(el('span', '', 'JETZT')); sc.appendChild(el('span', '', '30 MIN'));
      tl.appendChild(sc); body.appendChild(tl);
    }
    return wrap;
  }

  var VIEWS = { tafel: ['t-box', blockTafel], modern: ['m-box', blockModern], hell: ['h-box', blockHell] };

  function render() {
    var now = Date.now(), v = VIEWS[mode], box = $(v[0]);
    box.textContent = '';
    CONNS.forEach(function (c) { box.appendChild(v[1](c, upcoming(c, now), now)); });

    /* Zeile oben links: Uhrzeit (Tafel, Hell) oder Live-Anzeige (Modern) */
    var tl = $('top-l'), stale = !state.at || state.err || (now - state.at) > 90000;
    if (mode !== 'modern') { tl.textContent = tf.format(new Date(now)); tl.removeAttribute('data-s'); }
    else { tl.textContent = stale ? 'VERALTET' : 'LIVE'; tl.setAttribute('data-s', stale ? 'old' : 'ok'); }

    var err = $('err'), bar = $('bar');
    err.hidden = !state.err;
    if (state.err) setText('err-t', state.err);
    bar.setAttribute('data-s', state.err ? 'bad' : (state.at ? 'ok' : ''));
    if (state.at) {
      var age = Math.round((now - state.at) / 1000);
      setText('stamp', (state.err ? 'Letzter Abruf ' : 'Aktualisiert ') + tfs.format(new Date(state.at)) + ' Uhr' + (state.err && age > 60 ? ' (vor ' + Math.round(age / 60) + ' Min)' : ''));
    } else setText('stamp', state.err ? 'Kein Abruf möglich' : 'Noch nicht geladen');
  }

  /* ---- Umschalter ---- */
  function setMode(next, persist) {
    mode = (next === 'tafel' || next === 'modern') ? next : 'hell';
    document.documentElement.setAttribute('data-mode', mode);
    $('v-tafel').hidden = mode !== 'tafel';
    $('v-modern').hidden = mode !== 'modern';
    $('v-hell').hidden = mode !== 'hell';
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode));
    });
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', mode === 'modern' ? '#08141D' : (mode === 'hell' ? '#F4F1EC' : '#0A0805'));
    if (persist) { try { localStorage.setItem(KEY, mode); } catch (e) {} }
    render();
  }
  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-mode]') : null;
    if (b) setMode(b.getAttribute('data-mode'), true);
  });

  function start() {
    clearInterval(timer);
    timer = setInterval(function () { if (!document.hidden) load(); }, EVERY);
  }
  $('reload').addEventListener('click', load);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); start(); } });
  setInterval(render, 1000);

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  setMode(saved, false);
  load(); start();
})();
</script>
</body>
</html>
